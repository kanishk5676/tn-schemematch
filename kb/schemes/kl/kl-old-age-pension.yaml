id: kl-old-age-pension
name: Indira Gandhi National Old Age Pension (Kerala)
name_ml: വാർദ്ധക്യകാല പെൻഷൻ
level: state
jurisdiction: KL
authority: Local Self Government Department, Government of Kerala
sectors: [social_security, elderly]
benefit_type: pension
status: draft

summary: >
  Kerala's monthly social security pension for people aged 60 and above with a family
  income up to Rs 1 lakh a year, paid through the local body (panchayat or municipality).

benefit_prose: >
  Currently, the rate of major social security pensions is Rs 2,000 per month.

value: {amount: 2000, per: month}

cannot_combine_with:
  - id: nsap-ignwps
    reason: "In Kerala the national pensions are paid as the state's social security pensions, and the panchayat checks 'whether the applicant is receiving any other social security pension'."
  - id: nsap-igndps
    reason: "In Kerala the national pensions are paid as the state's social security pensions, and the panchayat checks 'whether the applicant is receiving any other social security pension'."
  - id: nsap-ignoaps
    reason: "Kerala's old age pension is the state's implementation of IGNOAPS — one pension, not two."
  - id: kl-widow-pension
    reason: "Only one social security pension is paid; the panchayat checks 'whether the applicant is receiving any other social security pension'."
  - id: kl-disability-pension
    reason: "Only one social security pension is paid; the panchayat checks 'whether the applicant is receiving any other social security pension'."
  - id: kl-agricultural-labour-pension
    reason: "Only one social security pension is paid; the panchayat checks 'whether the applicant is receiving any other social security pension'."
  - id: kl-unmarried-women-pension
    reason: "Only one social security pension is paid; the panchayat checks 'whether the applicant is receiving any other social security pension'."

eligibility_prose: >
  Family annual income limit is Rs. 1,00,000. Must have completed sixty years of age. Must
  have permanent residence in the State of Kerala for at least three years. The applicant
  should not be a service pensioner/family pensioner. The applicant should not be an income
  tax payer. The applicant or the family should not own more than two acres of property
  (not applicable to Scheduled Tribe categories). Should not be residing in houses having
  an area of more than 2000 sq. ft., modern flooring and concrete construction. The family
  should not own non-taxi vehicles with an engine capacity of more than 1000 CC, except
  Ambassador cars. Should not have an air conditioner in the house of residence.

eligibility:
  all:
    - {attr: state, op: eq, value: KL}
    - {attr: annual_family_income, op: lte, value: 100000, note: "'Family annual income limit is Rs. 1,00,000.'"}
    - {attr: receives_other_pension, op: eq, value: false, note: "'should not be a service pensioner/family pensioner'"}
    - {attr: is_income_tax_payer, op: eq, value: false}
    - any:
        - {attr: land_owned_acres, op: lte, value: 2}
        - {attr: social_category, op: eq, value: ST, note: "the two-acre limit does not apply to Scheduled Tribes"}
    - {attr: age, op: gte, value: 60}

documents:
  - Age proof
  - Income certificate
  - Proof of permanent residence in Kerala
  - Aadhaar card
  - Bank account passbook

apply_url: https://welfarepension.lsgkerala.gov.in/

