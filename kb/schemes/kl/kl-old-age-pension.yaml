notes: >
  Applied for at the local body where the applicant permanently lives, or online through
  the Sevana pension portal. The rate is the one all three panchayat pages state; a 2023
  press report gave Rs 1,600, so the amount has changed recently and must be re-checked.

  TO VERIFY (human pass): one panchayat page adds "The applicant should be destitute /
  without adequate means of support"; the page citing Government Orders does not, and the
  income limit appears to do that work. is_destitute is therefore not read here.

  MODELLING LIMITATIONS, stated rather than hidden: the residence period in Kerala, the
  2,000 sq ft / modern-flooring house test, the "non-taxi vehicle above 1000 CC except an
  Ambassador" test and the air-conditioner test have no attribute in the vocabulary, so
  they are not checked. A person who fails one of them is shown as eligible here; the
  panchayat will catch it. owns_four_wheeler is deliberately NOT used as a stand-in — it
  would wrongly exclude small cars and Ambassadors, which the rule allows.
