notes: >
  The service-pension clause is carried over from the other four pensions, whose pages
  state it; the Maravanthuruthu list for this pension does not repeat it. The two-acre limit
  appears in this pension's documents list, as a self-certified statement, rather than in
  its eligibility list.

  MODELLING LIMITATION: "released from membership of the Agricultural Labour Welfare Fund"
  and the ten years' residence have no attribute; occupation [agri_labourer, retired] is a
  loose stand-in for "eligible as an agricultural worker" and over-includes retired people
  from other work.

  MODELLING LIMITATIONS, stated rather than hidden: the residence period in Kerala, the
  2,000 sq ft / modern-flooring house test, the "non-taxi vehicle above 1000 CC except an
  Ambassador" test and the air-conditioner test have no attribute in the vocabulary, so
  they are not checked. A person who fails one of them is shown as eligible here; the
  panchayat will catch it. owns_four_wheeler is deliberately NOT used as a stand-in — it
  would wrongly exclude small cars and Ambassadors, which the rule allows.
