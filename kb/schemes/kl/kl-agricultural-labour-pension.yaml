id: kl-agricultural-labour-pension
name: Agricultural Workers Pension (Kerala)
name_ml: കർഷകത്തൊഴിലാളി പെൻഷൻ
level: state
jurisdiction: KL
authority: Local Self Government Department, Government of Kerala
sectors: [social_security, agriculture, elderly]
benefit_type: pension
status: draft

summary: >
  Kerala's monthly social security pension for agricultural labourers aged 60 and above
  with a family income up to Rs 1 lakh a year.

benefit_prose: >
  Currently, the rate of major social security pensions is Rs 2,000 per month.

value: {amount: 2000, per: month}

cannot_combine_with:
  - id: nsap-ignoaps
    reason: "In Kerala the national pensions are paid as the state's social security pensions, and the panchayat checks 'whether the applicant is receiving any other social security pension'."
  - id: nsap-ignwps
    reason: "In Kerala the national pensions are paid as the state's social security pensions, and the panchayat checks 'whether the applicant is receiving any other social security pension'."
  - id: nsap-igndps
    reason: "In Kerala the national pensions are paid as the state's social security pensions, and the panchayat checks 'whether the applicant is receiving any other social security pension'."
  - id: kl-unmarried-women-pension
    reason: "Only one social security pension is paid; the panchayat checks 'whether the applicant is receiving any other social security pension'."

eligibility_prose: >
  Provided to agricultural labourers who have completed 60 years of age. Family annual
  income should not exceed one lakh rupees. Must have been released from membership of the
  Agricultural Labour Welfare Fund. A document proving permanent residence in Kerala for at
  least 10 consecutive years immediately preceding the application. The applicant should
  not be an income tax payer. A self-certified statement that neither the applicant nor the
  family owns more than two acres of land (not applicable to Scheduled Tribe categories).

eligibility:
  all:
    - {attr: state, op: eq, value: KL}
    - {attr: annual_family_income, op: lte, value: 100000, note: "'Family annual income limit is Rs. 1,00,000.'"}
    - {attr: receives_other_pension, op: eq, value: false, note: "'should not be a service pensioner/family pensioner'"}
    - {attr: is_income_tax_payer, op: eq, value: false}
    - any:
        - {attr: land_owned_acres, op: lte, value: 2}
        - {attr: social_category, op: eq, value: ST, note: "the two-acre limit does not apply to Scheduled Tribes"}
    - {attr: age, op: gte, value: 60}
    - {attr: occupation, op: in, value: [agri_labourer, retired],
       note: "an agricultural labourer at 60 may describe themselves as retired; the panchayat checks the work history"}

documents:
  - Age proof
  - Income certificate
  - Certificate of release from the Agricultural Labour Welfare Fund
  - Proof of permanent residence in Kerala
  - Aadhaar card
  - Bank account passbook

apply_url: https://welfarepension.lsgkerala.gov.in/

