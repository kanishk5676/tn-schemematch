notes: >
  This scheme is the single best illustration of why matching is not retrieval. Every
  clause is a threshold or a categorical gate, several are near-miss traps (5 acres wet
  versus 10 acres dry; 3,600 electricity units), and the "head of the family" condition
  is the kind of attribute a citizen never volunteers unprompted. A system that retrieves
  this scheme correctly and then asserts eligibility has done almost none of the work.

  VERIFICATION PASS 2026-09-04 (web sources, not yet a human sign-off). Of the three items
  v0.1 flagged:

  (a) LAND CEILINGS — RESOLVED as inclusive. The guideline summary reads "family land
  holding not exceeding 5 acres (wetland) and 10 acres (dryland)", which is the lte the rule
  already used. A persona holding exactly 5.0 wet acres is eligible.

  (c) SCOPE OF THE EXCLUSIONS — RESOLVED as family-scoped, and the rule has been changed:
  income tax is now tested with family_has_income_tax_payer, and government employment
  against both the applicant and the spouse. This is a substantive change to who the KB
  says is eligible — a woman whose husband is a government clerk was eligible under v0.1
  and is not now.

  (b) FOUR-WHEELER CARVE-OUT — NOT RESOLVED, and the sources now openly conflict. The
  eligibility_prose in this file (from the departmental wording) carves out tractors,
  autorickshaws and other livelihood vehicles; the guideline summary retrieved on
  2026-09-04 names "cars, jeeps, tractors and heavy vehicles for personal use" as
  disqualifying. The encoded rule follows the stricter reading — any four-wheeler
  disqualifies — which will produce false negatives for a farming family owning a tractor.
  This is the highest-value item left in this scheme's queue: tractor ownership is common
  in exactly the population the scheme targets.

  This scheme remains the single best illustration of why matching is not retrieval. Every
  clause is a threshold or a categorical gate, several are near-miss traps (5 acres wet
  versus 10 acres dry; 3,600 electricity units), and the "head of the family" condition is
  the kind of attribute a citizen never volunteers unprompted. A system that retrieves this
  scheme correctly and then asserts eligibility has done almost none of the work.
