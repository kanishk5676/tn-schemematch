id: kmut
name: Kalaignar Magalir Urimai Thogai
name_ta: கலைஞர் மகளிர் உரிமைத் தொகை
level: state
jurisdiction: TN
authority: Social Welfare and Women Empowerment Department, Government of Tamil Nadu
sectors: [women, income_support]
benefit_type: cash_transfer
status: draft

summary: >
  Rs 1,000 per month paid directly to the woman recognised as the head of an eligible
  Tamil Nadu family, as a rights-based entitlement rather than a targeted subsidy.

benefit_prose: >
  Rs 1,000 per month (Rs 12,000 per year) by direct benefit transfer to the bank account
  of the eligible woman head of the family.

value: {amount: 1000, per: month, per_family: true}

eligibility_prose: >
  A woman who has completed 21 years of age and is recognised as the head of the family
  on the family card is eligible. Only one woman member per family card may receive the
  entitlement. The annual family income must not exceed Rs 2.5 lakh. The family must not
  own more than 5 acres of wet land (nanjai) or more than 10 acres of dry land (punjai),
  must not own a four-wheeler (other than a tractor, autorickshaw or similar goods or
  livelihood vehicle), and the household's annual electricity consumption must be below
  3,600 units. Income tax payers and government employees, and their families, are excluded.

eligibility:
  all:
    - {attr: state, op: eq, value: TN}
    - {attr: gender, op: eq, value: female}
    - {attr: age, op: gte, value: 21}
    - {attr: is_head_of_household, op: eq, value: true}
    - {attr: ration_card_type, op: ne, value: none, note: "entitlement attaches to a family card"}
    - {attr: annual_family_income, op: lte, value: 250000,
       note: "the guideline summary says both 'less than Rs 2.5 lakh' and 'income exceeding Rs 2.5 lakh ... ineligible'; the two agree everywhere except at exactly Rs 2,50,000, where lte is the generous reading"}
    - {attr: wetland_acres, op: lte, value: 5.0, note: "'not exceeding 5 acres (wetland)' — inclusive, confirmed 2026-09-04"}
    - {attr: dryland_acres, op: lte, value: 10.0, note: "'not exceeding 10 acres (dryland)' — inclusive, confirmed 2026-09-04"}
    - {attr: owns_four_wheeler, op: eq, value: false,
       note: "the guideline summary names cars, jeeps, tractors and heavy vehicles for personal use, with no livelihood carve-out"}
    - {attr: annual_electricity_units, op: lt, value: 3600, note: "'below 3,600 units'"}
    - not: {attr: family_has_income_tax_payer, op: eq, value: true,
            note: "family-scoped: 'women with an annual family income exceeding Rs 2.5 lakh and who are income tax assesses'"}
    - not: {attr: is_government_employee, op: eq, value: true}
    - not: {attr: spouse_is_government_employee, op: eq, value: true,
