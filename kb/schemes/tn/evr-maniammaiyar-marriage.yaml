id: evr-maniammaiyar-marriage
name: E.V.R. Maniammaiyar Ninaivu Widow Daughter's Marriage Assistance Scheme
name_ta: ஈ.வெ.ரா. மணியம்மையார் நினைவு ஏழை விதவைகளின் புதல்வியர் திருமண உதவித் திட்டம்
level: state
jurisdiction: TN
authority: Social Welfare and Women Empowerment Department, Government of Tamil Nadu
sectors: [women, marriage_assistance]
benefit_type: cash_transfer
status: draft

summary: >
  Marriage assistance for the daughter of a poor widow, paid at a higher rate if the bride
  holds a degree or diploma.

benefit_prose: >
  Rs 25,000 and an 8 gram gold coin for a bride who has passed the tenth standard, or
  Rs 50,000 and an 8 gram gold coin for a degree or diploma holder.

eligibility_prose: >
  The bride must be the daughter of a poor widow whose annual family income does not
  exceed Rs 72,000. The bride must be at least 18 years of age and the groom at least 21.
  Only one daughter of the widow is eligible. The application must be made within 40 days
  before the marriage.

eligibility:
  all:
    - {attr: state, op: eq, value: TN}
    - {attr: gender, op: eq, value: female}
    - {attr: age, op: gte, value: 18}
    - {attr: marital_status, op: eq, value: unmarried}
    - {attr: has_upcoming_marriage, op: eq, value: true}
    - {attr: is_daughter_of_widow, op: eq, value: true}
    - {attr: annual_family_income, op: lte, value: 72000,
       note: "district sources state the ceiling as 'should not exceed Rs 72,000', hence lte rather than lt"}

documents:
  - Widow certificate of the mother
  - Income certificate
  - Age proof and educational certificates
  - Marriage invitation
  - Bank account passbook

apply_url: https://tnsocialwelfare.tn.gov.in/

sources:
  - url: https://virudhunagar.nic.in/departments/social-welfare/
    title: "Social Welfare — Virudhunagar District, Government of Tamil Nadu"
    publisher: Government of Tamil Nadu
    retrieved: 2026-09-04
    note: "States the Rs 72,000 income ceiling, the 18/21 age floors, the one-daughter limit and the 40-day window."
  - url: https://kancheepuram.nic.in/departments/social-welfare/
    title: "Social Welfare — Kancheepuram District, Government of Tamil Nadu"
    publisher: Government of Tamil Nadu
    retrieved: 2026-09-04
    note: "Corroborates the two assistance tiers and the education condition."

notes: >
  MODELLING LIMITATIONS, both of which make this rule more generous than the scheme:
  (a) the groom's minimum age of 21 is a fact about a second person and is not encodable
  from a single applicant profile; (b) the "only one daughter of the widow" limit is a
  fact about the family's history of claims. Neither is encoded, so the rule will report
  eligible a bride whose sister has already claimed.

  The education condition is not encoded as a gate because it selects the *rate* rather
  than eligibility — a bride with no qualification is eligible under the first tier in the
  Kancheepuram wording ("10th pass or no qualification required"). TO VERIFY: the
  Virudhunagar wording instead requires a 10th pass certificate, and the two districts
  cannot both be right.
