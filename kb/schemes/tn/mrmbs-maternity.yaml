notes: >
  A rare scheme with no income test, included deliberately as a counterweight: a KB in
  which every rule has an income ceiling would let a system score well by always guessing
  "poor qualifies, non-poor does not". Here a high-income pregnant woman in Tamil Nadu
  genuinely qualifies, and a system that has learned the income heuristic will produce a
  false negative.

  MODELLING LIMITATION (v0.1) — RESOLVED at the 2026-09-04 verification pass: v0.2 adds the
  pregnancy_order attribute, and the two-pregnancy limit is now encoded. Personas built
  around a third pregnancy are in scope again, and are worth building: a third-pregnancy
  persona in Tamil Nadu satisfies every surface cue for this scheme and fails it, which is
  the trap shape this benchmark is short of.
