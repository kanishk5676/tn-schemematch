id: mrmbs
name: Dr. Muthulakshmi Reddy Maternity Benefit Scheme
name_ta: மருத்துவர் முத்துலட்சுமி ரெட்டி மகப்பேறு நிதி உதவித் திட்டம்
level: state
jurisdiction: TN
authority: Health and Family Welfare Department, Government of Tamil Nadu
sectors: [health, women, maternity]
benefit_type: cash_transfer
status: draft

summary: >
  Maternity assistance of Rs 18,000 per pregnancy to compensate for wage loss and support
  nutrition, paid in instalments to pregnant women in Tamil Nadu.

benefit_prose: >
  Rs 18,000 per pregnancy, comprising Rs 14,000 in cash paid in three instalments and two
  nutrition kits worth Rs 2,000. Part of the amount is contributed by the central
  government under Pradhan Mantri Matru Vandana Yojana.

eligibility_prose: >
  Pregnant women resident in Tamil Nadu who register the pregnancy through the Pregnancy
  and Infant Cohort Monitoring and Evaluation portal or at an Anganwadi centre are
  eligible. The scheme is universal within the state and applies no income ceiling.
  Assistance is limited to the first two pregnancies.

eligibility:
  all:
    - {attr: state, op: eq, value: TN}
    - {attr: gender, op: eq, value: female}
    - {attr: pregnancy_status, op: in, value: [pregnant, lactating]}
    - {attr: age, op: gte, value: 18}
    - {attr: pregnancy_order, op: lte, value: 2,
       note: "'assistance is limited to the first two pregnancies' — encodable since v0.2 added pregnancy_order"}

plain:
  # Spoken words for a citizen, drawn from benefit_prose and eligibility_prose
  # above. reviewed: true only after a person has checked them against the source.
  reviewed: false
  ta:
    name: "முத்துலட்சுமி ரெட்டி மகப்பேறு உதவி"
    what: "ஒவ்வொரு பிரசவத்துக்கும் 18,000 ரூபாய்: 14,000 ரூபாய் பணம், இரண்டு ஊட்டச்சத்துப் பெட்டகங்கள்."
    who: "கர்ப்பத்தைப் பதிவு செய்த தமிழ்நாட்டு கர்ப்பிணிப் பெண்கள் அனைவரும், முதல் இரண்டு பிரசவங்களுக்கு. வருமான வரம்பு இல்லை."
    where: "கிராம சுகாதார செவிலியர் அல்லது ஆரம்ப சுகாதார நிலையம் — பிக்மி எண் பெற."
  en:
    name: "Muthulakshmi Reddy maternity benefit"
    what: "₹18,000 for each pregnancy: ₹14,000 in cash and two nutrition kits."
    who: "Every pregnant woman in Tamil Nadu who registers her pregnancy, for the first two. No income limit."
    where: "The village health nurse or primary health centre, for a PICME number."

documents:
  - PICME registration number
  - Antenatal care card
  - Aadhaar card
  - Bank account passbook

