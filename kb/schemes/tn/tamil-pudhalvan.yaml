id: tamil-pudhalvan
name: Tamil Pudhalvan Thittam
name_ta: தமிழ் புதல்வன் திட்டம்
level: state
jurisdiction: TN
authority: School Education Department, Government of Tamil Nadu
sectors: [education]
benefit_type: scholarship
status: draft

summary: >
  The counterpart of Pudhumai Penn for boys: Rs 1,000 per month to male students who
  completed classes 6 to 12 in government schools and go on to higher education.

benefit_prose: >
  Rs 1,000 per month by direct benefit transfer until completion of the undergraduate
  degree, diploma or ITI course.

value: {amount: 1000, per: month}

eligibility_prose: >
  Male students who studied classes 6 to 12 in government schools in Tamil Nadu, passed
  class 12, and are currently enrolled in an undergraduate degree, professional course,
  diploma or ITI course are eligible. Correspondence, distance education and open
  university courses are excluded.

eligibility:
  all:
    - {attr: state, op: eq, value: TN}
    - {attr: gender, op: eq, value: male}
    - {attr: studied_in_government_school, op: eq, value: true}
    - {attr: education_level, op: in, value: [higher_secondary, iti_diploma, undergraduate]}
    - {attr: enrolled_in_higher_education, op: eq, value: true}
    - {attr: course_mode, op: eq, value: regular}

plain:
  # Spoken words for a citizen, drawn from benefit_prose and eligibility_prose
  # above. reviewed: true only after a person has checked them against the source.
  reviewed: false
  ta:
    name: "தமிழ்ப் புதல்வன் திட்டம்"
    what: "கல்லூரியில் படிக்கும் மாணவனுக்குப் படிப்பு முடியும் வரை மாதம் 1,000 ரூபாய்."
    who: "6 முதல் 12ஆம் வகுப்பு வரை அரசுப் பள்ளியில் படித்து, இப்போது கல்லூரி, டிப்ளமோ அல்லது ஐ.டி.ஐ.யில் நேரடி வகுப்பில் படிக்கும் மாணவர்கள்."
    where: "நீங்கள் படிக்கும் கல்லூரி மூலம் விண்ணப்பிக்கலாம்."
  en:
    name: "Tamil Pudhalvan, for boy students"
    what: "₹1,000 a month to a boy student until he finishes his course."
    who: "Boys who studied 6th to 12th in a government school and now study a degree, diploma or ITI course in regular classes."
    where: "Apply through your college."

documents:
  - Class 12 mark sheet
  - Bonafide certificate from the higher education institution
  - Aadhaar card
  - Bank account passbook

apply_url: https://tamilpudhalvan.tn.gov.in/

sources:
  - url: https://www.tn.gov.in/scheme/data_view/6786
    title: "Tamil Pudhalvan Thittam — Government of Tamil Nadu scheme directory"
    publisher: Government of Tamil Nadu
    retrieved: 2026-08-15

notes: >
  Deliberately near-identical to pudhumai-penn except for the gender gate and the absence
  of a marks condition. This pair is the cleanest available test of whether a system is
  applying categorical constraints or pattern-matching on topic: a male student query that
  returns Pudhumai Penn is a false positive that no amount of good retrieval would prevent.

  TO VERIFY (human pass): whether a minimum marks condition applies here as it does for
  Pudhumai Penn. Sources reviewed so far do not state one; the rule currently omits it,
  which is the more generous reading.
