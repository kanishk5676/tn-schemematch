notes: >
  PARTLY VERIFIED 2026-09-04 (web pass, not yet a human sign-off): the scheme guideline as
  summarised by the Press Information Bureau states that "the person/family member should
  not be employed in government service", and defines family as "Husband, Wife, and
  unmarried children". The government-service exclusion is therefore now encoded at family
  scope via spouse_is_government_employee, which was added to the vocabulary for it. The
  v0.1 note below is retained because half of it still stands.

  STILL A MODELLING LIMITATION: "the benefit of the scheme shall be restricted to one member
  of the family only" is a fact about who else in the household has already claimed, not
  about the applicant, and no attribute can express it from a single profile. The rule will
  report eligible a second artisan in a family that has already enrolled one. This must be
  stated in the paper's limitations rather than passed over.

  STILL TO VERIFY (human pass): whether "unmarried children" extends the government-service
  test beyond the spouse, in which case a family_has_government_employee attribute is needed
  in place of the two-person approximation.
