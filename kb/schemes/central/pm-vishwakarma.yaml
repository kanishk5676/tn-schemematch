id: pm-vishwakarma
name: PM Vishwakarma
name_ta: பிரதம மந்திரி விஸ்வகர்மா
level: central
authority: Ministry of Micro, Small and Medium Enterprises, Government of India
sectors: [livelihood, skilling, credit]
benefit_type: loan
status: draft

summary: >
  End-to-end support for artisans and craftspeople in eighteen family-based traditional
  trades: recognition, skill training with a stipend, a toolkit grant, and collateral-free
  credit at a concessional rate.

benefit_prose: >
  PM Vishwakarma certificate and ID; skill training with a stipend of Rs 500 per day; a
  toolkit incentive of Rs 15,000; collateral-free enterprise development loans of up to
  Rs 1 lakh (first tranche) and Rs 2 lakh (second tranche) at 5 percent concessional
  interest; and incentives for digital transactions and marketing support.

eligibility_prose: >
  An artisan or craftsperson working with hands and tools, engaged on a self-employment
  basis in one of the eighteen listed family-based traditional trades in the unorganised
  sector, is eligible for registration. The applicant must have completed 18 years of age
  on the date of registration and must be engaged in the trade at the time of registration.
  The applicant must not have availed a loan under a similar credit-based scheme of the
  central or state government for enterprise development in the past five years — Mudra
  and PM SVANidhi borrowers who have fully repaid are eligible. Registration is restricted
  to one member per family, where family means husband, wife and unmarried children.
  Persons in government service, and members of their families, are not eligible.

eligibility:
  all:
    - {attr: age, op: gte, value: 18}
    - {attr: traditional_trade, op: ne, value: none, note: "must be in one of the 18 listed trades"}
    - {attr: occupation, op: in, value: [artisan, weaver, self_employed, daily_wage],
       note: "self-employment in the unorganised sector"}
    - not: {attr: is_government_employee, op: eq, value: true}
    - not: {attr: spouse_is_government_employee, op: eq, value: true,
            note: "the guideline says 'the person/family member should not be employed in government service'; family is defined as husband, wife and unmarried children"}
    - not: {attr: availed_govt_credit_scheme_last_5y, op: eq, value: true}

documents:
  - Aadhaar card
  - Bank account passbook
  - Ration card
  - Proof of engagement in the trade

apply_url: https://pmvishwakarma.gov.in/

