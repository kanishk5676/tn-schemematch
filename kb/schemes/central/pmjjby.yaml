    title: "Pradhan Mantri Jeevan Jyoti Bima Yojana"
    publisher: Wikipedia
    retrieved: 2026-09-04
    note: "SECONDARY SOURCE. jansuraksha.gov.in could not be retrieved; replace at verification."

notes: >
  SECONDARY SOURCING — see the source note. Not to be treated as verified.

  This scheme is deliberately near-universal among working-age adults with a bank account,
  and it is in the KB for that reason: a benchmark made only of sharply-gated schemes would
  not test whether a system can keep a broad eligibility alongside narrow ones without
  either dropping it or letting it swamp the answer.
