    retrieved: 2026-08-15

notes: >
  STALENESS WARNING, and a motivating example for this benchmark: the scheme originally
  capped eligibility at 2 hectares of cultivable land, but that ceiling was withdrawn in
  2019 and the scheme now covers all landholding farmer families regardless of size.
  A large share of secondary sources — including several that would be scraped into a
  retrieval corpus — still state the withdrawn 2-hectare limit. A RAG system reading that
  prose will produce confident false negatives for farmers with more than 2 hectares.
  The encoded rule follows the current guideline; the discrepancy is retained here
  deliberately as an audit note.

  VERIFIED 2026-09-04 (web pass, not yet a human sign-off): the exclusions ARE family-scoped.
  The scheme defines a family as "the husband, wife, and any minor children", and the
  exclusion list is written against any member of it. The rule now reads
  family_has_income_tax_payer and tests both the applicant and the spouse for government
  service; both attributes were added to the vocabulary for this. The same pass reconfirmed
  that no land ceiling applies, which is the staleness trap recorded above.

  STILL TO VERIFY (human pass): the Class IV carve-out is encoded as covering both the
  government-service and the pension exclusions, following the wording of the operational
  guidelines; and "minor children" means the family test should not propagate to adult
  children living in the household, which the two-person spouse test approximates.
