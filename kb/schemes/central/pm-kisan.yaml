id: pm-kisan
name: Pradhan Mantri Kisan Samman Nidhi (PM-KISAN)
name_ta: பிரதம மந்திரி கிசான் சம்மான் நிதி
level: central
authority: Ministry of Agriculture and Farmers Welfare, Government of India
sectors: [agriculture, income_support]
benefit_type: cash_transfer
status: draft

summary: >
  Income support of Rs 6,000 per year, paid in three four-monthly instalments directly
  into the bank account of every landholding farmer family, subject to a set of
  affluence-based exclusions.

benefit_prose: >
  Rs 6,000 per year per landholding farmer family, transferred as three instalments of
  Rs 2,000 by direct benefit transfer.

eligibility_prose: >
  All landholding farmer families — defined as a family comprising husband, wife and
  minor children that owns cultivable land in the records of the concerned State or
  Union Territory — are eligible. The following are excluded: institutional landholders;
  present and former holders of constitutional posts; serving or former Ministers, MPs,
  MLAs, MLCs, Mayors of municipal corporations and chairpersons of district panchayats;
  serving or retired officers and employees of central or state government ministries,
  offices, departments, PSUs and attached or autonomous bodies, and regular employees of
  local bodies (excluding multi-tasking Class IV and Group D staff); superannuated or
  retired pensioners drawing a monthly pension of Rs 10,000 or more (again excluding
  Class IV and Group D staff); anyone who paid income tax in the last assessment year;
  and professionals such as doctors, engineers, lawyers, chartered accountants and
  architects who are registered with professional bodies and practising.

eligibility:
  all:
    - {attr: land_owned_acres, op: gt, value: 0, note: "family must own cultivable land"}
    - {attr: occupation, op: in, value: [farmer, agri_labourer, self_employed, homemaker, retired, daily_wage, weaver, artisan, fisher, unemployed],
       note: "landholding is the operative test, not stated occupation; agricultural labourers who own land qualify"}
    - {attr: age, op: gte, value: 18}
    - not: {attr: held_constitutional_post, op: eq, value: true}
    - not: {attr: is_registered_professional, op: eq, value: true}
    - not: {attr: family_has_income_tax_payer, op: eq, value: true,
            note: "family-scoped: the guidelines exclude a family any of whose members paid income tax in the last assessment year"}
    - any:
        - all:
            - {attr: is_government_employee, op: eq, value: false}
            - {attr: spouse_is_government_employee, op: eq, value: false}
        - {attr: is_class_iv_employee, op: eq, value: true, note: "Class IV / Group D and multi-tasking staff are carved out of the exclusion"}
    - any:
        - {attr: monthly_pension_amount, op: lt, value: 10000}
        - {attr: is_class_iv_employee, op: eq, value: true}

documents:
  - Aadhaar card
  - Land record / chitta-adangal
  - Bank account passbook

apply_url: https://pmkisan.gov.in/

sources:
