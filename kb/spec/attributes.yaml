# TN-SchemeMatch attribute vocabulary (v0.1)
#
# This file is the single source of truth for the normalized attribute space.
# Both the scheme rule KB and the persona profiles are typed against it.
#
# Every attribute declares:
#   type        : number | enum | bool | date_year
#   description : what it means, in eligibility terms
#   unit        : (number only) canonical unit; all inputs normalize to this
#   domain      : (number) [min, max] ; (enum) list of canonical values
#   aliases     : surface forms -> canonical value. Used by the normalizer and by
#                 the attribute-extraction step of the grounding pipeline. Includes
#                 Tamil script, romanized Tamil, and English variants, because queries
#                 are code-mixed.
#   derived_from: (optional) attribute is computed, never elicited directly.
#   elicitable  : whether an agent may ask the citizen for it (derived attrs: false)
#   sensitivity : low | medium | high — used for elicitation-burden analysis.

version: "0.2"
updated: "2026-09-04"

attributes:

  # ---------------------------------------------------------------- identity
  age:
    type: number
    unit: years
    domain: [0, 120]
    description: Age of the applicant in completed years.
    elicitable: true
    sensitivity: low
    aliases_text: ["age", "vayasu", "வயசு", "வயது", "years old", "vayathu"]

  gender:
    type: enum
    domain: [male, female, transgender]
    description: Gender as recorded for scheme eligibility purposes.
    elicitable: true
    sensitivity: low
    aliases:
      male: ["male", "m", "man", "ஆண்", "aan", "aambalai", "ஆம்பளை"]
      female: ["female", "f", "woman", "பெண்", "pen", "penn", "ponnu", "பொண்ணு", "magalir", "மகளிர்"]
      transgender: ["transgender", "trans", "thirunangai", "திருநங்கை", "third gender", "tg"]

  marital_status:
    type: enum
    domain: [unmarried, married, widowed, divorced, deserted]
    description: Marital status. Several TN welfare schemes are widow- or deserted-wife-specific.
    elicitable: true
    sensitivity: medium
    aliases:
      unmarried: ["unmarried", "single", "kalyanam aagala", "கல்யாணம் ஆகல", "thirumanam aagavillai"]
      married: ["married", "kalyanam aachu", "கல்யாணம் ஆச்சு", "manaivi", "kanavan", "thirumanam aanavar"]
      widowed: ["widow", "widowed", "widower", "vidhavai", "விதவை", "kanavan iranthavar", "கணவன் இறந்தவர்"]
      divorced: ["divorced", "divorce aagiduchu", "விவாகரத்து", "vivagarathu"]
      deserted: ["deserted", "abandoned wife", "kaividapatta", "கைவிடப்பட்ட", "husband left"]

  social_category:
    type: enum
    domain: [SC, SCA, ST, MBC, DNC, BC, BCM, FC]
    description: >
      Tamil Nadu reservation category. SCA = Arunthathiyar (sub-quota within SC);
      DNC = Denotified Communities; BCM = Backward Class Muslim; FC = Forward /
      "Others" (no category benefit).
    elicitable: true
    sensitivity: high
    aliases:
      SC: ["sc", "scheduled caste", "ஆதிதிராவிடர்", "adi dravidar", "adi dravida", "தாழ்த்தப்பட்ட"]
      SCA: ["sca", "arunthathiyar", "அருந்ததியர்", "arunthathiya"]
      ST: ["st", "scheduled tribe", "பழங்குடி", "malai vazh makkal", "மலைவாழ் மக்கள்", "tribal"]
      MBC: ["mbc", "most backward class", "மிகவும் பிற்படுத்தப்பட்டோர்", "migavum pirpaduthapattor"]
      DNC: ["dnc", "denotified", "denotified community", "ஆறுமுக", "dnt"]
      BC: ["bc", "backward class", "பிற்படுத்தப்பட்டோர்", "pirpaduthapattor", "obc"]
      BCM: ["bcm", "backward class muslim", "bc muslim", "பிற்படுத்தப்பட்ட முஸ்லிம்"]
      FC: ["fc", "forward caste", "oc", "open category", "general", "others", "பொது"]

  religion:
    type: enum
    domain: [hindu, muslim, christian, sikh, buddhist, jain, parsi, other]
    description: Religion. Relevant to minority-specific central and state schemes.
    elicitable: true
    sensitivity: high
    aliases:
      hindu: ["hindu", "இந்து", "indhu"]
      muslim: ["muslim", "islam", "இஸ்லாம்", "musleem"]
      christian: ["christian", "kirithavar", "கிறிஸ்தவர்", "catholic", "protestant"]
      sikh: ["sikh", "சீக்கியர்"]
      buddhist: ["buddhist", "புத்த"]
      jain: ["jain", "சமணர்"]
      parsi: ["parsi", "zoroastrian"]
      other: ["other", "none", "no religion", "atheist"]

  # ---------------------------------------------------------------- location
  state:
    type: enum
    domain: [TN, other]
    description: >
      Domicile state, collapsed to TN vs other. Central schemes are open to both;
      TN state schemes require TN. Expand this domain if the KB is extended to
      other states.
    elicitable: true
    sensitivity: low
    aliases:
      TN: ["tamil nadu", "tamilnadu", "tn", "தமிழ்நாடு", "tamizhagam", "தமிழகம்"]
      other: ["other state", "outside tn", "vera state", "வேறு மாநிலம்"]

  district:
    type: enum
    description: District of residence (38 Tamil Nadu districts). Used for district-scoped schemes.
    elicitable: true
    sensitivity: low
    domain:
      [Ariyalur, Chengalpattu, Chennai, Coimbatore, Cuddalore, Dharmapuri,
       Dindigul, Erode, Kallakurichi, Kancheepuram, Kanyakumari, Karur,
       Krishnagiri, Madurai, Mayiladuthurai, Nagapattinam, Namakkal, Nilgiris,
       Perambalur, Pudukkottai, Ramanathapuram, Ranipet, Salem, Sivaganga,
       Tenkasi, Thanjavur, Theni, Thoothukudi, Tiruchirappalli, Tirunelveli,
       Tirupattur, Tiruppur, Tiruvallur, Tiruvannamalai, Tiruvarur, Vellore,
       Viluppuram, Virudhunagar]
    aliases:
      Chennai: ["chennai", "madras", "சென்னை", "chennai city"]
      Coimbatore: ["coimbatore", "kovai", "கோயம்புத்தூர்", "கோவை", "cbe"]
      Tiruchirappalli: ["tiruchirappalli", "trichy", "திருச்சி", "tiruchi", "trichinopoly"]
      Thoothukudi: ["thoothukudi", "tuticorin", "தூத்துக்குடி"]
      Tirunelveli: ["tirunelveli", "nellai", "நெல்லை", "திருநெல்வேலி"]
      Nilgiris: ["nilgiris", "ooty", "the nilgiris", "நீலகிரி", "udhagamandalam"]
      Kanyakumari: ["kanyakumari", "kanniyakumari", "nagercoil", "கன்னியாகுமரி"]
      Viluppuram: ["viluppuram", "villupuram", "விழுப்புரம்"]
      Thanjavur: ["thanjavur", "tanjore", "தஞ்சாவூர்"]
      Madurai: ["madurai", "மதுரை"]
      Salem: ["salem", "சேலம்"]
      Vellore: ["vellore", "வேலூர்"]
      Erode: ["erode", "ஈரோடு"]
      Tiruppur: ["tiruppur", "tirupur", "திருப்பூர்"]
      Tiruvallur: ["tiruvallur", "thiruvallur", "திருவள்ளூர்"]
      Kancheepuram: ["kancheepuram", "kanchipuram", "காஞ்சிபுரம்"]
      Sivaganga: ["sivaganga", "sivagangai", "சிவகங்கை"]
      Ramanathapuram: ["ramanathapuram", "ramnad", "இராமநாதபுரம்"]
      Virudhunagar: ["virudhunagar", "விருதுநகர்"]

  residence_type:
    type: enum
    domain: [rural, urban]
    description: Rural or urban residence. Several housing and employment schemes are scoped by this.
    elicitable: true
    sensitivity: low
    aliases:
      rural: ["rural", "village", "gramam", "கிராமம்", "ooru", "ஊரு", "panchayat"]
      urban: ["urban", "city", "town", "நகரம்", "nagaram", "corporation", "municipality"]

  # ------------------------------------------------------------------ income
  annual_family_income:
    type: number
    unit: INR_per_year
    domain: [0, 100000000]
    description: >
      Total annual family income in rupees. The normalizer converts monthly figures
      (x12) and lakh/crore/thousand shorthand to this canonical unit.
    elicitable: true
    sensitivity: high
    aliases_text: ["income", "salary", "varumanam", "வருமானம்", "sambalam", "சம்பளம்", "earning"]

  is_income_tax_payer:
    type: bool
    description: Whether the applicant or spouse filed income tax in the last assessment year. Common exclusion clause.
    elicitable: true
    sensitivity: medium

  is_government_employee:
    type: bool
    description: >
      Serving or retired government employee, including PSUs and autonomous bodies.
      Common exclusion clause. Class IV / Group D staff are carved out of some
      exclusions; where a scheme does that, the rule uses is_class_iv_employee.
    elicitable: true
    sensitivity: medium

  is_class_iv_employee:
    type: bool
    description: >
      Government employee in Class IV / Group D (multi-tasking staff). PM-KISAN and
      several central schemes exempt this grade from the government-employee exclusion.
    elicitable: true
    sensitivity: medium

  monthly_pension_amount:
    type: number
    unit: INR_per_month
    domain: [0, 1000000]
    description: Monthly government pension received, in rupees (0 if none).
    elicitable: true
    sensitivity: medium

  is_registered_professional:
    type: bool
    description: >
      Practising doctor, engineer, lawyer, chartered accountant, or architect
      registered with a professional body. A named PM-KISAN exclusion.
    elicitable: true
    sensitivity: low

  held_constitutional_post:
    type: bool
    description: >
      Present or former holder of a constitutional post, Minister, MP, MLA, Mayor, or
      chairperson of a district panchayat. A named PM-KISAN exclusion.
    elicitable: true
    sensitivity: low

  fixed_assets_value:
    type: number
    unit: INR
    domain: [0, 1000000000]
    description: >
      Total value of fixed assets (land, house) in rupees. Tamil Nadu's destitution
      test for social security pensions is a ceiling on this figure.
    elicitable: true
    sensitivity: high

  annual_electricity_units:
    type: number
    unit: units_per_year
    domain: [0, 500000]
    description: >
      Household electricity consumption in units (kWh) per year. Used as a proxy
      affluence test by Kalaignar Magalir Urimai Thogai.
    elicitable: true
    sensitivity: low

  is_destitute:
    type: bool
    description: >
      Certified destitute — no regular source of income and no family member able to
      support the applicant. Gate for Tamil Nadu social security pensions.
    elicitable: true
    sensitivity: high

  is_head_of_household:
    type: bool
    description: Named as the head of the family on the ration card.
    elicitable: true
    sensitivity: low

  # -------------------------------------------------------------------- land
  land_owned_acres:
    type: number
    unit: acres
    domain: [0, 1000]
    description: >
      Total agricultural land owned by the family, in acres. Normalizer converts
      hectares (x2.4710538), cents (/100), grounds (/18.15) and square feet (/43560).
    elicitable: true
    sensitivity: medium
    aliases_text: ["land", "nilam", "நிலம்", "acre", "ekkar", "ஏக்கர்", "hectare", "cent", "பூமி"]

  wetland_acres:
    type: number
    unit: acres
    domain: [0, 1000]
    description: >
      Irrigated / wet land (nanjai, நன்செய்) owned, in acres. Tamil Nadu schemes
      routinely set separate ceilings for wet and dry land, so the split is a distinct
      attribute rather than a refinement of land_owned_acres.
    elicitable: true
    sensitivity: medium
    aliases_text: ["nanjai", "நன்செய்", "nansei", "wet land", "irrigated land", "punjai illatha"]

  dryland_acres:
    type: number
    unit: acres
    domain: [0, 1000]
    description: Rain-fed / dry land (punjai, புன்செய்) owned, in acres.
    elicitable: true
    sensitivity: medium
    aliases_text: ["punjai", "புன்செய்", "punsei", "dry land", "rainfed land", "maanavari"]

  is_landless:
    type: bool
    description: Owns no agricultural land.
    derived_from: land_owned_acres
    elicitable: false
    sensitivity: low

  farmer_category:
    type: enum
    domain: [landless, marginal, small, semi_medium, medium, large]
    description: >
      Standard Indian landholding class derived from land_owned_acres:
      marginal <= 2.47 ac (1 ha), small <= 4.94 ac (2 ha), semi_medium <= 9.88 ac,
      medium <= 24.7 ac, large above.
    derived_from: land_owned_acres
    elicitable: false
    sensitivity: low

  # ------------------------------------------------------- household / assets
  ration_card_type:
    type: enum
    domain: [aay, phh_rice, nphh_sugar, nphh_no_commodity, none]
    description: >
      Tamil Nadu PDS family card class. AAY = Antyodaya Anna Yojana (poorest);
      phh_rice = priority household rice card; nphh_sugar = non-priority sugar card;
      nphh_no_commodity = "no commodity" card (typically higher income);
      none = no family card.
    elicitable: true
    sensitivity: medium
    aliases:
      aay: ["aay", "antyodaya", "annapurna card"]
      phh_rice: ["rice card", "arisi card", "அரிசி கார்டு", "phh", "priority household", "ration card irukku", "white card"]
      nphh_sugar: ["sugar card", "sakkarai card", "சர்க்கரை கார்டு", "khaki card", "nphh"]
      nphh_no_commodity: ["no commodity card", "no commodity", "green card"]
      none: ["no ration card", "card illa", "கார்டு இல்ல", "none"]

  house_ownership:
    type: enum
    domain: [owns_pucca, owns_kutcha, rented, homeless]
    description: Housing status. Housing schemes typically exclude existing pucca-house owners.
    elicitable: true
    sensitivity: medium
    aliases:
      owns_pucca: ["pucca house", "concrete house", "own house", "sonatha veedu", "சொந்த வீடு", "terrace house"]
      owns_kutcha: ["kutcha house", "hut", "kudisai", "குடிசை", "thatched house", "olai veedu"]
      rented: ["rented", "vaadagai", "வாடகை", "rent veedu", "tenant"]
      homeless: ["homeless", "no house", "veedu illa", "வீடு இல்ல", "pavement dweller"]

  owns_four_wheeler:
    type: bool
    description: Family owns a four-wheeled motor vehicle. Common exclusion clause.
    elicitable: true
    sensitivity: low

  family_size:
    type: number
    unit: persons
    domain: [1, 30]
    description: Number of members in the family card / household.
    elicitable: true
    sensitivity: low

  # ------------------------------------------------- occupation and education
  occupation:
    type: enum
    domain: [farmer, agri_labourer, fisher, weaver, artisan, daily_wage,
             salaried_private, salaried_government, self_employed, student,
             homemaker, unemployed, retired]
    description: Primary occupation of the applicant.
    elicitable: true
    sensitivity: low
    aliases:
      farmer: ["farmer", "vivasayi", "விவசாயி", "agriculturist", "cultivator", "vevasayam", "விவசாயம்"]
      agri_labourer: ["agricultural labourer", "farm labour", "vivasaya coolie", "விவசாய கூலி", "kuthagai"]
      fisher: ["fisherman", "fisher", "meenavar", "மீனவர்", "fishing"]
      weaver: ["weaver", "nesavalar", "நெசவாளர்", "handloom", "powerloom worker"]
      artisan: ["artisan", "craftsman", "kaithozhilali", "கைத்தொழிலாளி", "potter", "blacksmith", "carpenter"]
      daily_wage: ["daily wage", "coolie", "கூலி", "kooli velai", "labourer", "construction worker"]
      salaried_private: ["private job", "company velai", "கம்பெனி வேலை", "private employee", "it job"]
      salaried_government: ["government job", "govt job", "arasu velai", "அரசு வேலை", "government servant"]
      self_employed: ["self employed", "business", "sontha thozhil", "சொந்த தொழில்", "shop", "kadai", "vendor"]
      student: ["student", "manavar", "மாணவர்", "studying", "padikren", "படிக்கிறேன்"]
      homemaker: ["housewife", "homemaker", "veetamma", "இல்லத்தரசி", "illatharasi"]
      unemployed: ["unemployed", "no job", "velai illa", "வேலை இல்ல", "jobless"]
      retired: ["retired", "ooivu", "ஓய்வு", "pensioner"]

  education_level:
    type: enum
    domain: [none, primary, middle, secondary, higher_secondary, iti_diploma,
             undergraduate, postgraduate, doctorate]
    description: Highest education level completed.
    elicitable: true
    sensitivity: low
    aliases:
      none: ["not studied", "illiterate", "padikkala", "படிக்கல", "no schooling"]
      primary: ["primary", "5th", "5th std", "ainthaam vaguppu"]
      middle: ["middle school", "8th", "8th std", "ettaam vaguppu"]
      secondary: ["10th", "sslc", "matriculation", "pathaam vaguppu", "பத்தாம் வகுப்பு"]
      higher_secondary: ["12th", "hsc", "plus two", "+2", "panniradaam vaguppu"]
      iti_diploma: ["iti", "diploma", "polytechnic"]
      undergraduate: ["degree", "ug", "ba", "bsc", "bcom", "be", "btech", "bachelor"]
      postgraduate: ["pg", "ma", "msc", "mcom", "me", "mtech", "mba", "master"]
      doctorate: ["phd", "doctorate", "research scholar"]

  is_first_generation_learner:
    type: bool
    description: First person in the family to pursue higher education. Used by TN education incentives.
    elicitable: true
    sensitivity: low

  studied_in_government_school:
    type: bool
    description: >
      Studied classes 6-12 in a government or government-aided school. Gate for TN's
      Pudhumai Penn / Tamil Pudhalvan education incentives.
    elicitable: true
    sensitivity: low

  enrolled_in_higher_education:
    type: bool
    description: >
      Currently enrolled in an undergraduate degree, diploma, or ITI course. Distinct
      from education_level, which records what has already been completed.
    elicitable: true
    sensitivity: low

  course_mode:
    type: enum
    domain: [not_applicable, regular, distance, correspondence, open_university]
    description: >
      Mode of the current course. Several scholarships fund regular enrolment only and
      explicitly exclude distance, correspondence, and open-university study.
    elicitable: true
    sensitivity: low
    aliases:
      not_applicable: ["not applicable", "na", "not studying"]
      regular: ["regular", "full time", "college la", "on campus", "direct"]
      distance: ["distance", "distance education", "தொலைநிலை"]
      correspondence: ["correspondence", "correspondence course"]
      open_university: ["open university", "ignou", "tnou", "open"]

  previous_exam_percent:
    type: number
    unit: percent
    domain: [0, 100]
    description: Marks percentage in the most recent qualifying examination.
    elicitable: true
    sensitivity: low

  traditional_trade:
    type: enum
    description: >
      One of the 18 family-based traditional trades recognised by PM Vishwakarma,
      or 'none'. Kept as its own attribute rather than folded into occupation because
      the trade list is a closed, scheme-defined vocabulary.
    elicitable: true
    sensitivity: low
    domain: [none, carpenter, boat_maker, armourer, blacksmith, hammer_toolkit_maker,
             locksmith, goldsmith, potter, sculptor, cobbler, mason, basket_weaver,
             doll_toy_maker, barber, garland_maker, washerman, tailor, fishing_net_maker]
    aliases:
      none: ["none", "not a traditional trade", "no trade"]
      carpenter: ["carpenter", "thatchan", "தச்சன்", "asari", "wood work"]
      boat_maker: ["boat maker", "boat builder", "padagu"]
      armourer: ["armourer", "arms maker"]
      blacksmith: ["blacksmith", "kollan", "கொல்லன்", "iron smith"]
      hammer_toolkit_maker: ["hammer and tool kit maker", "tool maker"]
      locksmith: ["locksmith", "lock maker", "poottu"]
      goldsmith: ["goldsmith", "thattan", "தட்டான்", "jewellery maker"]
      potter: ["potter", "kuyavan", "குயவன்", "pot maker"]
      sculptor: ["sculptor", "stone carver", "sirpi", "சிற்பி", "stone breaker"]
      cobbler: ["cobbler", "chappal maker", "shoe maker", "footwear artisan"]
      mason: ["mason", "kothanar", "கொத்தனார்", "rajmistry"]
      basket_weaver: ["basket weaver", "mat maker", "broom maker", "coir weaver"]
      doll_toy_maker: ["doll maker", "toy maker", "bommai"]
      barber: ["barber", "naavithar", "hair cutter", "salon"]
      garland_maker: ["garland maker", "malai kattubavar", "flower garland"]
      washerman: ["washerman", "vannan", "வண்ணான்", "dhobi", "laundry"]
      tailor: ["tailor", "thaiyalkarar", "தையல்காரர்", "stitching"]
      fishing_net_maker: ["fishing net maker", "net maker", "valai"]

  availed_govt_credit_scheme_last_5y:
    type: bool
    description: >
      Took a loan under a similar central or state credit-linked scheme (PMEGP,
      Mudra, SVANidhi and the like) in the last five years. Exclusion for PM Vishwakarma;
      fully repaid Mudra/SVANidhi borrowers are carved out in the scheme's own wording.
    elicitable: true
    sensitivity: medium

  # ---------------------------------------------------------- status / health
  disability_percent:
    type: number
    unit: percent
    domain: [0, 100]
    description: Certified disability percentage (0 if none).
    elicitable: true
    sensitivity: high
    aliases_text: ["disability", "handicapped", "maatru thiranali", "மாற்றுத்திறனாளி", "ooname", "ஊனம்"]

  is_disabled:
    type: bool
    description: Certified disability of 40 percent or more (the standard Indian threshold).
    derived_from: disability_percent
    elicitable: false
    sensitivity: high

  pregnancy_status:
    type: enum
    domain: [not_applicable, pregnant, lactating]
    description: Pregnancy or lactation status. Gates maternity benefit schemes.
    elicitable: true
    sensitivity: high
    aliases:
      pregnant: ["pregnant", "karpini", "கர்ப்பிணி", "expecting", "vayathula", "வயித்துல"]
      lactating: ["lactating", "breastfeeding", "paal koduthu", "பாலூட்டும் தாய்"]
      not_applicable: ["not pregnant", "na", "not applicable"]

  is_senior_citizen:
    type: bool
    description: Age 60 or above.
    derived_from: age
    elicitable: false
    sensitivity: low

  is_widow:
    type: bool
    description: Widowed.
    derived_from: marital_status
    elicitable: false
    sensitivity: medium

  receives_other_pension:
    type: bool
    description: Already receiving a government pension. Most TN social security pensions exclude these applicants.
    elicitable: true
    sensitivity: medium

  # ------------------------------------------------------------- documents
  has_aadhaar:
    type: bool
    description: Holds an Aadhaar number. Near-universal precondition for DBT schemes.
    elicitable: true
    sensitivity: low

  has_bank_account:
    type: bool
    description: Holds a bank account (required for direct benefit transfer).
    elicitable: true
    sensitivity: low

  has_community_certificate:
    type: bool
    description: Holds a caste/community certificate. Required to claim category-reserved benefits.
    elicitable: true
    sensitivity: medium


  # ------------------------------------------------- v0.2 additions
  # Added when the KB was extended past the ten seed schemes. Each one exists
  # because a scheme's published wording reads it and the v0.1 vocabulary could
  # not express it — several of them close gaps that v0.1 recorded as explicit
  # MODELLING LIMITATION notes (family-scoped exclusions, refugee routes into
  # CMCHIS, birth parity for maternity benefits).

  is_bpl:
    type: bool
    description: >
      Household appears in the state's Below Poverty Line list. The NSAP pensions
      (IGNWPS, IGNDPS, NFBS) are BPL-gated by their own wording, so this is encoded
      as its own attribute rather than approximated by an income threshold — the BPL
      list is an administrative status, not a computed one, and conflating them would
      silently change who the benchmark says is eligible.
    elicitable: true
    sensitivity: high
    aliases_text: ["bpl", "below poverty line", "vaRumai kOttukku keezh", "வறுமைக் கோட்டுக்குக் கீழ்"]

  is_secc_deprived_household:
    type: bool
    description: >
      Household is identified as deprived under the SECC 2011 criteria used to build
      the Ayushman Bharat PM-JAY beneficiary list. Distinct from is_bpl: the lists are
      built from different surveys and neither implies the other.
    elicitable: true
    sensitivity: high

  has_lpg_connection:
    type: bool
    description: Household already holds an LPG connection from an oil marketing company. Named exclusion in PMUY.
    elicitable: true
    sensitivity: low
    aliases_text: ["gas connection", "lpg", "silinder", "சிலிண்டர்", "gas cylinder"]

  pregnancy_order:
    type: number
    unit: pregnancies
    domain: [0, 15]
    description: >
      Which pregnancy this is for the applicant, counting from 1. Zero when not pregnant.
      PMMVY pays for the first child and for a second child only if it is a girl, and
      MRMBS caps assistance at two pregnancies; neither could be encoded from v0.1's
      pregnancy_status alone, which was recorded as a modelling limitation in mrmbs.yaml.
    elicitable: true
    sensitivity: high

  daughters_count:
    type: number
    unit: persons
    domain: [0, 15]
    description: Number of living daughters. Read by the girl-child protection and maternity schemes.
    elicitable: true
    sensitivity: medium

  sons_count:
    type: number
    unit: persons
    domain: [0, 15]
    description: Number of living sons. Read together with daughters_count by schemes that require a girl-only family.
    elicitable: true
    sensitivity: medium

  has_undergone_family_planning:
    type: bool
    description: >
      A parent has undergone a permanent family-planning procedure. The Chief Minister's
      Girl Child Protection Scheme requires it, and it is encoded rather than dropped
      because it is a real gate that excludes families who would otherwise qualify.
    elicitable: true
    sensitivity: high

  is_orphan:
    type: bool
    description: Both parents deceased. Gate for the Annai Theresa marriage assistance scheme.
    elicitable: true
    sensitivity: high
    aliases_text: ["orphan", "anaathai", "அனாதை", "parents died"]

  is_daughter_of_widow:
    type: bool
    description: >
      Applicant's mother is a widow. Read by the E.V.R. Maniammaiyar widow-daughter
      marriage assistance scheme, whose beneficiary is the daughter, not the widow.
    elicitable: true
    sensitivity: medium

  has_upcoming_marriage:
    type: bool
    description: >
      A marriage of the applicant is taking place inside the scheme's application window
      (40 days before, or the stated post-marriage window). Marriage assistance is a
      one-off payment tied to an event, not a standing status, and without this attribute
      every unmarried adult woman in the benchmark would evaluate ELIGIBLE for every
      marriage scheme.
    elicitable: true
    sensitivity: medium
    aliases_text: ["marriage fixed", "kalyanam fix", "கல்யாணம்", "getting married", "wedding"]

  is_inter_caste_marriage:
    type: bool
    description: >
      The marriage is between partners of different communities, one of whom is SC.
      Gate for the Dr. Muthulakshmi Reddy inter-caste marriage assistance scheme.
    elicitable: true
    sensitivity: high

  years_since_desertion:
    type: number
    unit: years
    domain: [0, 80]
    description: >
      Years since the applicant was deserted by her husband. Tamil Nadu's deserted-wives
      pension requires desertion for at least five years, or a legal separation.
    elicitable: true
    sensitivity: high

  spouse_is_government_employee:
    type: bool
    description: >
      Spouse is a serving or retired government employee. Several exclusions are written
      at family scope ("no member of the family is in government service"); v0.1
      approximated them with the applicant-level test and recorded the approximation as a
      limitation. This attribute and family_has_income_tax_payer let those clauses be
      encoded as written.
    elicitable: true
    sensitivity: medium

  family_has_income_tax_payer:
    type: bool
    description: >
      Any member of the family filed income tax in the last assessment year. The
      family-scoped counterpart of is_income_tax_payer.
    elicitable: true
    sensitivity: high

  is_covered_by_epfo_esic_nps:
    type: bool
    description: >
      Member of EPFO, ESIC, or the National Pension System. A named exclusion in PM-SYM
      and in the central maternity benefit, both of which are for workers outside the
      organised-sector safety net.
    elicitable: true
    sensitivity: medium
    aliases_text: ["pf", "epf", "esi", "esic", "provident fund", "nps"]

  is_registered_unorganised_worker:
    type: bool
    description: >
      Registered as an unorganised worker (e-Shram card, or a Tamil Nadu welfare board).
      Read as an inclusion criterion by PMMVY and by the state welfare board schemes.
    elicitable: true
    sensitivity: low
    aliases_text: ["e-shram", "eshram", "labour card", "welfare board", "தொழிலாளர் அட்டை"]

  has_mgnrega_job_card:
    type: bool
    description: Holds an MGNREGA job card. One of the qualifying categories for PMMVY.
    elicitable: true
    sensitivity: low
    aliases_text: ["job card", "nrega", "mgnrega", "100 days work", "நூறு நாள் வேலை"]

  has_vending_certificate:
    type: bool
    description: >
      Holds a Certificate of Vending or a Letter of Recommendation from the urban local
      body or town vending committee. The operative eligibility document for PM SVANidhi.
    elicitable: true
    sensitivity: low

  is_member_of_fishermen_cooperative:
    type: bool
    description: >
      Member of a fishermen or fisherwomen cooperative society. Membership, not
      occupation, is what the fisheries relief schemes actually test.
    elicitable: true
    sensitivity: low

  is_srilankan_tamil_refugee:
    type: bool
    description: >
      Sri Lankan Tamil refugee resident in a Tamil Nadu camp. CMCHIS admits this group by
      a separate route, and v0.1 could not encode it — the omission was recorded in
      cmchis.yaml as silently excluding one of the populations least well served by
      existing tooling.
    elicitable: true
    sensitivity: high

  is_inter_state_migrant:
    type: bool
    description: >
      Inter-state migrant worker resident in Tamil Nadu. The second CMCHIS route that
      v0.1 could not express.
    elicitable: true
    sensitivity: medium

  spouse_is_differently_abled:
    type: bool
    description: >
      Spouse (or intended spouse) has a certified disability. Tamil Nadu's marriage
      assistance for the differently abled pays when a differently abled person marries
      another differently abled person, or when one marries an able-bodied partner, at
      different rates.
    elicitable: true
    sensitivity: medium

  employment_exchange_registration_years:
    type: number
    unit: years
    domain: [0, 60]
    description: >
      Years since registering with the district employment exchange. The differently
      abled unemployment allowance requires one completed year of registration.
    elicitable: true
    sensitivity: low

# Derivation rules, applied by normalize.derive() after base attributes are set.
derivations:
  is_landless:
    from: land_owned_acres
    rule: "value == 0"
  farmer_category:
    from: land_owned_acres
    bins:
      - { max: 0.0,   value: landless }
      - { max: 2.47,  value: marginal }
      - { max: 4.94,  value: small }
      - { max: 9.88,  value: semi_medium }
      - { max: 24.71, value: medium }
      - { max: null,  value: large }
  is_disabled:
    from: disability_percent
    rule: "value >= 40"
  is_senior_citizen:
    from: age
    rule: "value >= 60"
  is_widow:
    from: marital_status
    rule: "value == 'widowed'"

# Unit conversions to canonical units, used by normalize.parse_quantity().
units:
  INR_per_year:
    INR_per_year: 1
    INR_per_month: 12
    thousand_per_year: 1000
    thousand_per_month: 12000
    lakh_per_year: 100000
    lakh_per_month: 1200000
    crore_per_year: 10000000
  acres:
    acres: 1
    hectares: 2.4710538
    cents: 0.01
    grounds: 0.05509642      # 1 ground = 2400 sq ft
    square_feet: 0.000022957 # 1 acre = 43560 sq ft
  INR:
    INR: 1
    thousand: 1000
    lakh: 100000
    crore: 10000000
  INR_per_month:
    INR_per_month: 1
    thousand: 1000
    lakh: 100000
  units_per_year:
    units_per_year: 1
    units_per_month: 12
  percent:
    percent: 1
