  MH: {name_en: Maharashtra,    name_ta: மகாராஷ்டிரா}
  MP: {name_en: Madhya Pradesh, name_ta: மத்தியப் பிரதேசம்}
  OD: {name_en: Odisha,         name_ta: ஒடிசா}
  PB: {name_en: Punjab,         name_ta: பஞ்சாப்}
