# Display names for the jurisdictions a scheme can belong to.
#
# Separate from the `state` attribute's alias table on purpose. Aliases are lowercased
# surface forms a citizen might type ("tamilnadu", "தமிழ்நாடு") and are matched by
# substring; these are the names the system writes back out — into the RAG corpus, the
# schemes browser, and the dashboard. Reusing one for the other produces "Government of
# tamilnadu" in the retrieval text, which is both ugly and worse for lexical retrieval.
#
# Codes are ISO 3166-2:IN subdivision codes with the "IN-" prefix stripped. A code appears
# in the `state` attribute's domain only once the KB actually carries a scheme for it —
# see tests/test_kb_and_personas.py::test_state_domain_matches_the_scheme_tree.

#
# `districts` lists, for each state whose districts the vocabulary carries, the values of
# the `district` attribute that belong to it. Validation checks that the two agree and
# that a state scheme names only its own state's districts. `ration_cards` lists the card
# classes each state issues. Guided mode offers only these once the state is known.

version: "0.2"
updated: "2026-10-26"

jurisdictions:
  TN: {name_en: Tamil Nadu,     name_ta: தமிழ்நாடு,     name_ml: തമിഴ്നാട്}
  KL: {name_en: Kerala,         name_ta: கேரளா,         name_ml: കേരളം}
  AP: {name_en: Andhra Pradesh, name_ta: ஆந்திரப் பிரதேசம்}
