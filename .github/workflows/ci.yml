# Every test runs offline against ScriptedClient, so CI needs no API key or secrets.
name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # models brings Pillow, which the document tests need; without it they skip.
      - name: Install
        run: pip install -e ".[dev,models,web]"

      - name: Tests
        run: python -m pytest -q

      # Fails on a broken rule; ageing sources print as warnings only.
      - name: Validate the knowledge base
        run: schemematch validate
