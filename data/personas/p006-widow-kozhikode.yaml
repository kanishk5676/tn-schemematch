id: p006
persona_sketch: 'Widow of 56 in a Kozhikode village with ten cents of land and a pink ration card,
  living on about Rs 5,000 a month. The first Kerala test profile: the Kerala widow pension and
  the central IGNWPS are one pension, so only the Kerala one may be counted.

  '
