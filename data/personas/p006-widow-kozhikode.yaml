  notes: 'SEED PERSONA — NOT YET NATIVELY VALIDATED.


    Design intent: the can''t-combine check. She qualifies for the Kerala widow pension (Rs 2,000
    a month) and the central IGNWPS (Rs 300), but Kerala''s widow pension is the state''s implementation
    of IGNWPS. A list that shows both, or a total that adds both, is wrong. The query mixes Malayalam
    script and Manglish, and gives land in cents, the unit Kerala uses.

    '
