queries:
  code_mixed: >-
    vanakkam, naan oru vivasayi. enkitta rendu ekkar nilam irukku, ration card-um irukku.
    enakku enna scheme laam kedaikum?
  english: >-
    Hello, I am a farmer. I have two acres of land and I also have a ration card.
    Which schemes can I get?

stated_in_query:
  - occupation
  - land_owned_acres
  - ration_card_type

annotation:
  author: "seed (project author)"
  validated_by: ""
  validated_on: ""
  codemix_naturalness: null
  profile_plausibility: null
  parallel_faithful: null
  notes: >
    SEED PERSONA — NOT YET NATIVELY VALIDATED. Written by the project author to exercise
    the pipeline; it must not be counted in any reported result until a native Tamil
    speaker has rated the code-mixing and confirmed that the two variants reveal exactly
    the same three facts.

    Design intent: the query gives land as a bare "rendu ekkar" with no wet/dry split, so
    a system must ask before it can decide Kalaignar Magalir Urimai Thogai — which it
    should not, since the applicant is male. Watch for systems that return KMUT anyway
    because "farmer + ration card + Tamil Nadu" is topically close.
