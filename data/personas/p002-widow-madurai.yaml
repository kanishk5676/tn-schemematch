queries:
  code_mixed: >-
    en kanavar போன வருஷம் இறந்துட்டார். ippo naan thaan family head, rendu pasanga
    irukanga. maasam 7000 mattum thaan varum. enakku edhavadhu udhavi kedaikuma?
  english: >-
    My husband died last year. I am the head of the family now, with two children.
    I only earn about 7,000 a month. Is there any assistance I can get?

stated_in_query:
  - gender
  - marital_status
  - is_head_of_household
  - annual_family_income
  - family_size

annotation:
  author: "seed (project author)"
  validated_by: ""
  validated_on: ""
  codemix_naturalness: null
  profile_plausibility: null
  parallel_faithful: null
  notes: >
    SEED PERSONA — NOT YET NATIVELY VALIDATED.

    Design intent: this is the false-positive trap the whole benchmark is built around.
    Every surface cue points at the destitute widow pension — widowed, low income, female
    — and she does not qualify for it, because she has a regular income and so fails the
    destitution test. A system that pattern-matches on "widow" will send her to a district
    office for nothing. The correct behaviour is either to ask whether she is certified
    destitute, or to leave the pension out.

    The query mixes Tamil script and romanized Tamil in one sentence, which is ordinary in
    real messages and rare in existing benchmarks. Keep that mixture; do not normalize it
    to one script during validation.
