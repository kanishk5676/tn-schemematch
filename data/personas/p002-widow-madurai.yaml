id: p002
persona_sketch: >
  Recently widowed woman in Madurai, head of her family card, earning about Rs 7,000 a
  month from daily wage work. Qualifies for the women's entitlement and health cover, but
  not for the widow pension — she has an income, so she is not destitute.

