  codemix_naturalness: null
  profile_plausibility: null
  parallel_faithful: null
  notes: >
    SEED PERSONA — NOT YET NATIVELY VALIDATED.

    Design intent: this persona exists because the metric-discrimination pilot found the
    benchmark had no coverage of exclusion clauses. Every one of PM Vishwakarma's positive
    conditions is met — the right age, one of the eighteen listed trades, self-employed in
    the unorganised sector, not a government servant — and she is disqualified solely by
    the clause excluding anyone who took a similar government credit-linked loan in the
    past five years.

    That makes her the cheapest possible probe for the failure mode that costs the most.
    Exclusions only ever produce false positives when missed, and a prior Mudra loan is
    exactly the kind of fact a citizen does not think to mention when asking about help
    buying a sewing machine. A system must ask.

    Gold set is CMCHIS and Kalaignar Magalir Urimai Thogai. Any system returning
    pm-vishwakarma has missed the exclusion.
