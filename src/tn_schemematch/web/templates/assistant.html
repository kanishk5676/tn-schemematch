{% extends "base.html" %}
{% block title %}உதவி · Udhavi{% endblock %}
{% block body_class %}talk-page{% endblock %}
{% block body %}
<div class="talk">

  <section class="talk-main" aria-label="Conversation">
    <div class="mode-bar">
      <span class="mode-note" id="mode-note" aria-live="polite"></span>
      <button type="button" class="btn small" id="mode-switch" hidden></button>
    </div>

    <div class="messages" id="messages" aria-live="polite"></div>

    <!-- Guided mode: the open question's answer buttons, number pad, skip. -->
    <div class="answer" id="answer" aria-live="polite"></div>

    <!-- The result, as cards: shown when the questions finish or on request. -->
    <div id="result"></div>

    <div class="voice-bar">
      <button type="button" class="mic" id="mic" hidden aria-pressed="false">
        <span class="mic-icon" aria-hidden="true">🎤</span>
        <span class="mic-label" id="mic-label" data-i18n="mic">பேச அழுத்துங்கள்</span>
      </button>
      <div class="heard" id="heard" aria-live="polite"></div>
    </div>

    <form class="composer" id="composer" hidden>
      <textarea id="input" rows="1" data-i18n-placeholder="type_here" aria-label="Your message"></textarea>
      <button class="btn primary" id="send" data-i18n="send">அனுப்பு</button>
    </form>

    <div class="tools-row">
      <button type="button" class="btn big-secondary" id="result-btn" data-i18n="result_btn">எனக்கு என்ன கிடைக்கும்?</button>
      <button type="button" class="btn small" id="type-toggle" data-i18n="type_instead">எழுதிச் சொல்ல</button>
      <button type="button" class="btn small" id="attach">📎 <span data-i18n="upload">ஆவணத்தின் படம்</span></button>
      <label class="toggle small">
        <input type="checkbox" id="autoread" checked>
        <span data-i18n="autoread">பதில்களைத் தானாகப் படி</span>
      </label>
      <input type="file" id="file" accept="image/jpeg,image/png,image/webp" capture="environment" hidden>
    </div>
  </section>

  <aside class="rail" aria-label="Your details">
    <div class="card">
      <div class="eyebrow" data-i18n="talking_for">யாருக்காக</div>
      <select id="who" aria-label="Saved profile"></select>
      <div class="row" style="margin-top:9px">
        <button class="btn small primary" id="save" type="button" data-i18n="save">விவரங்களைச் சேமி</button>
        <button class="btn small" id="restart" type="button" data-i18n="start_over">புதிதாகத் தொடங்கு</button>
      </div>
      <p class="tiny muted" id="who-note" style="margin:8px 0 0"></p>
    </div>

    <div class="card counts">
      <div class="count ok"><span class="n" id="n-ok">0</span><span class="l" data-i18n="eligible_n">கிடைக்கும்</span></div>
      <div class="count open"><span class="n" id="n-open">—</span><span class="l" data-i18n="open_n">இன்னும் தெரியவில்லை</span></div>
    </div>

    <div class="card" id="told-card" hidden>
      <div class="eyebrow" data-i18n="what_you_told">நீங்கள் சொன்னவை</div>
      <dl class="told" id="told"></dl>
    </div>
  </aside>
</div>

<dialog id="save-dialog">
  <form method="dialog" class="dlg-body">
    <h2 data-i18n="save_title">உங்கள் விவரங்களைச் சேமிக்க</h2>
    <p class="muted" data-i18n="save_note"></p>
    <label class="muted" for="save-name" data-i18n="your_name">உங்கள் பெயர்</label>
    <input type="text" id="save-name" maxlength="80" required autocomplete="off">
    <div class="row dlg-actions">
      <button class="btn" value="cancel" formnovalidate data-i18n="cancel">வேண்டாம்</button>
      <button class="btn primary" value="save" data-i18n="save">விவரங்களைச் சேமி</button>
    </div>
  </form>
</dialog>

<dialog id="privacy-dialog">
  <form method="dialog" class="dlg-body">
    <h2 data-i18n="privacy_title">பேசுவதற்கு முன்</h2>
    <p data-i18n="privacy_text"></p>
    <div class="row dlg-actions">
      <button class="btn" value="no" data-i18n="privacy_no">வேண்டாம், எழுதுகிறேன்</button>
      <button class="btn primary" value="yes" data-i18n="privacy_yes">சரி, பேசுகிறேன்</button>
    </div>
  </form>
</dialog>
{% endblock %}

{% block scripts %}
<script type="module" src="{{ url_for('static', filename='js/assistant.js') }}"></script>
{% endblock %}
